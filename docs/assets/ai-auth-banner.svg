<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="600" viewBox="0 0 2400 600" role="img" aria-label="AI Auth — identity for AI agents">
  <defs>
    <radialGradient id="glow" cx="70%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8fe6ff" stop-opacity="0.16" />
      <stop offset="45%" stop-color="#8fe6ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#080a0d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9f4ff" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#3a93a8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0d2731" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fe6ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#8fe6ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#f0c98d" stop-opacity="0.35" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="2400" height="600" fill="#080a0d" />
  <rect width="2400" height="600" fill="url(#glow)" />
  <rect width="2400" height="600" fill="url(#grid)" />
  <rect width="2400" height="600" filter="url(#grain)" opacity="0.045" />

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="120" y="232" fill="#8fe6ff" font-size="26" font-weight="600" letter-spacing="9">SELF-CUSTODIED IDENTITY · OPEN PROTOCOL</text>
    <text x="112" y="378" fill="#eef2f4" font-size="168" font-weight="700" letter-spacing="-8">AI AUTH</text>
    <text x="120" y="452" fill="#9aa7b1" font-size="34" font-weight="400" letter-spacing="11">IDENTITY FOR AI AGENTS</text>
    <rect x="120" y="500" width="120" height="2" fill="#8fe6ff" opacity="0.8" />
    <text x="120" y="542" fill="#697580" font-size="22" letter-spacing="3">enzovezzaro.github.io/ai-auth</text>
  </g>

  <g transform="translate(1690 300)">
    <ellipse rx="300" ry="118" transform="rotate(-18)" fill="none" stroke="#8fe6ff" stroke-opacity="0.28" stroke-width="1.5" />
    <ellipse rx="258" ry="200" transform="rotate(32)" fill="none" stroke="#d8e4ea" stroke-opacity="0.15" stroke-width="1.5" />
    <ellipse rx="212" ry="212" fill="none" stroke="#f0c98d" stroke-opacity="0.2" stroke-width="1.5" />
    <circle r="150" fill="#8fe6ff" opacity="0.08" filter="url(#soft)" />

    <path d="M0 -150 L130 -75 L130 75 L0 150 L-130 75 L-130 -75 Z" fill="#0d151b" stroke="url(#edge)" stroke-width="2" />
    <path d="M0 -150 L0 0 L-130 -75 M0 -150 L0 0 L130 -75 M-130 75 L0 0 L130 75 M-130 -75 L-130 75 M130 -75 L130 75" fill="none" stroke="#8fe6ff" stroke-opacity="0.22" stroke-width="1.5" />
    <path d="M0 -86 L75 0 L0 86 L-75 0 Z" fill="url(#core)" stroke="#bff1ff" stroke-opacity="0.85" stroke-width="2" />
    <path d="M0 -86 L0 86 M-75 0 L75 0" fill="none" stroke="#eafcff" stroke-opacity="0.5" stroke-width="1" />

    <g fill="#8fe6ff">
      <circle cx="-268" cy="-62" r="3" opacity="0.8" />
      <circle cx="-225" cy="128" r="2.5" opacity="0.55" />
      <circle cx="-110" cy="-196" r="3" opacity="0.7" />
      <circle cx="96" cy="-178" r="2" opacity="0.6" />
      <circle cx="234" cy="-96" r="3" opacity="0.8" />
      <circle cx="286" cy="86" r="2.5" opacity="0.6" />
      <circle cx="118" cy="188" r="3" opacity="0.7" />
      <circle cx="-46" cy="214" r="2" opacity="0.5" />
      <circle cx="-306" cy="44" r="2" opacity="0.45" />
      <circle cx="312" cy="-28" r="2" opacity="0.5" />
    </g>

    <path d="M150 92 L320 178" fill="none" stroke="#f0c98d" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="7 7" />
    <circle cx="320" cy="178" r="9" fill="#f0c98d" opacity="0.9" />
    <circle cx="320" cy="178" r="20" fill="none" stroke="#f0c98d" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <rect x="1" y="1" width="2398" height="598" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
</svg>
