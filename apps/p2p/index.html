<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A self-custodied signing wallet and direct connection layer for AI agents."
    />
    <meta name="theme-color" content="#f3f1eb" />
    <title>AI Auth — Agent wallet</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      /* Phone-width fixes for the wallet pages. A long wallet ID must wrap
         inside the topbar instead of widening the page. */
      @media (max-width: 420px) {
        .topbar {
          flex-wrap: wrap;
        }
        .topbar > div:first-child {
          min-width: 0;
        }
        .topbar-status {
          min-width: 0;
          max-width: 100%;
        }
        .topbar-status > span:last-child {
          min-width: 0;
          overflow-wrap: anywhere;
        }
        .nav-item {
          white-space: normal;
          line-height: 1.2;
        }
      }
      /* The wallet ID on a plain panel must use the panel's text color. */
      .panel .key-id {
        color: inherit;
      }
      /* Touch targets are at least 44px tall on touch screens and phones. */
      @media (pointer: coarse), (max-width: 700px) {
        button,
        .button,
        .button.small,
        .nav-item,
        .checkbox-row,
        .control {
          min-height: 44px;
        }
      }
    </style>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to workspace</a>
    <div class="app-frame">
      <aside class="sidebar" aria-label="Workspace navigation">
        <a class="brand" href="./" aria-label="AI Auth wallet home">
          <img
            class="brand-mark"
            src="../docs/assets/ai-auth-mark.svg"
            alt=""
          />
          <span>AI Auth</span>
        </a>
        <div class="workspace-label">AGENT WALLET</div>
        <nav class="primary-nav" aria-label="Primary">
          <button class="nav-item" data-view="overview">
            <span class="nav-symbol" aria-hidden="true">⌂</span> Overview
          </button>
          <button class="nav-item" data-view="wallet">
            <span class="nav-symbol" aria-hidden="true">◈</span> Identity
          </button>
          <button class="nav-item" data-view="connect">
            <span class="nav-symbol" aria-hidden="true">↗</span> Permissions
          </button>
          <button class="nav-item" data-view="permissions">
            <span class="nav-symbol" aria-hidden="true">⌑</span> Grant access
          </button>
          <button class="nav-item" data-view="peer">
            <span class="nav-symbol" aria-hidden="true">⇄</span> Other agents
          </button>
          <button class="nav-item" data-view="activity">
            <span class="nav-symbol" aria-hidden="true">≋</span> Activity
          </button>
        </nav>
        <div class="sidebar-bottom">
          <div class="network-note">
            <span class="state-dot" aria-hidden="true"></span>
            <span>Local wallet</span>
          </div>
          <p>Keys stay in this browser. No account needed.</p>
          <a href="../docs/ARCHITECTURE.md">Architecture notes</a>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div>
            <p class="crumb">
              AI AUTH <span>/</span> <strong id="view-label">IDENTITY</strong>
            </p>
            <p class="topbar-caption">A signing wallet for agents</p>
          </div>
          <div class="topbar-status" id="topbar-status" aria-live="polite">
            <span class="state-dot" aria-hidden="true"></span>
            <span>Browser only</span>
          </div>
        </header>
        <main id="main" tabindex="-1">
          <div id="view" aria-live="polite" aria-busy="true">
            <p class="loading-note">Opening your local wallet…</p>
          </div>
          <div
            class="toast"
            id="toast"
            role="status"
            aria-live="polite"
            hidden
          ></div>
        </main>
        <footer class="footer-note">
          <span>AI Auth Wallet v0.2.0</span>
          <span>Open protocol · No account needed</span>
        </footer>
      </div>
    </div>
    <noscript
      >This wallet needs JavaScript to create and check signatures.</noscript
    >
  </body>
</html>
