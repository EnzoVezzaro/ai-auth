    <path d="M1040 143 1001 338" stroke-width="2" stroke-opacity=".5"/>
  </g>
  <g fill="#142351" stroke="#7e97f7" stroke-width="3" filter="url(#shadow)">
    <circle cx="1040" cy="143" r="27"/><circle cx="1001" cy="338" r="27"/>
    <circle cx="1405" cy="129" r="27"/><circle cx="1456" cy="357" r="27"/>
  </g>
  <g fill="none" stroke="#c8ddff" stroke-width="4" stroke-linecap="round">
    <path d="M1031 145l6 6 12-15"/>
    <path d="M992 338l7 7 11-14"/>
    <path d="M1396 130l6 6 12-15"/>
    <path d="M1447 358l6 6 12-15"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="1103" y="122" width="231" height="251" rx="34" fill="url(#panel)" stroke="#8e91ff" stroke-width="2.5"/>
    <rect x="1124" y="141" width="189" height="212" rx="24" fill="#0f173e" stroke="#8e99ee" stroke-opacity=".4"/>
    <path d="M1177 242v-40c0-26 19-47 42-47s42 21 42 47v40" fill="none" stroke="url(#icon)" stroke-width="15" stroke-linecap="round"/>
    <rect x="1154" y="231" width="132" height="100" rx="22" fill="url(#icon)"/>
    <circle cx="1220" cy="272" r="12" fill="#111b48"/>
    <path d="M1220 281v21" stroke="#111b48" stroke-width="10" stroke-linecap="round"/>
    <circle cx="1286" cy="326" r="31" fill="#18385f" stroke="#73ecfb" stroke-width="3"/>
    <path d="m1271 326 11 11 20-24" fill="none" stroke="#80fff2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#70daec">
