name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install local MCP dependencies
        run: npm ci
        working-directory: packages/mcp
      - name: Install headless agent runtime dependencies
        run: npm ci
        working-directory: packages/agent
      - name: Run wallet, runtime, MCP, and agent suites
        run: npm run test:all
      - name: Install Chromium for browser collaboration E2E
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run protocol and browser E2E
        run: npm run test:e2e
      - name: Build static landing page, wallet, and browser SDK
        run: npm run build
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Verify packed consumer imports
        run: npm run verify:packages
      - name: Check formatting
        run: npm run format:check
      - name: Verify GitHub Pages-only hosting
        run: node scripts/verify-pages-only.mjs
      - name: Check whitespace errors
        run: git diff --check
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Audit MCP production dependencies
        run: npm audit --omit=dev
        working-directory: packages/mcp
      - name: Audit agent runtime production dependencies
        run: npm audit --omit=dev
        working-directory: packages/agent
      - name: Check types for public declarations
        run: npm run test:types
